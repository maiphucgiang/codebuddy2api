services:
  codebuddy2api:
    image: ghcr.io/maiphucgiang/codebuddy2api:1.0.0
    container_name: codebuddy2api
    ports:
      - "8787:8787"
    volumes:
      - ./auth:/data/auth
    environment:
      CODEBUDDY2API_KEY: ${CODEBUDDY2API_KEY:-}
      CODEBUDDY_AUTH_DIR: /data/auth
    command: >
      python3 converter.py
      --host 0.0.0.0
      --port 8787
      --skip-check
      --desensitize
    restart: unless-stopped
